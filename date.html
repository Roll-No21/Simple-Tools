<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today's date · Simple Tools</title>
  <meta name="description" content="Today's date and month in numbers, a compact calendar, and every month with the number of days it holds.">
  <meta name="theme-color" content="#e9e3da">
  <script>
    /* set the look before the first paint so there is no colour flash */
    try {
      var stTheme = JSON.parse(localStorage.getItem("st.theme") || "null");
      var stAccent = JSON.parse(localStorage.getItem("st.accent") || "null");
      if (stTheme === "dark" || (!stTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
      if (stAccent) document.documentElement.style.setProperty("--accent", stAccent);
    } catch (err) { /* private mode, carry on */ }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%236b8f71'/%3E%3Cpath d='M50 18a32 32 0 0 1 0 64z' fill='%23fffdf8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="date">

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html"><span class="brand-mark">◐</span><span>Simple Tools</span></a>
      <nav class="nav" aria-label="Main">
        <a href="index.html" data-nav="home">Home</a>
        <a href="date.html" data-nav="date">Date</a>
        <a href="special.html" data-nav="special">Special day</a>
        <a href="time-12h.html" data-nav="time12">24 → 12</a>
        <a href="time-zones.html" data-nav="zones">Time zones</a>
        <a href="calculator.html" data-nav="calc">Calculator</a>
        <a href="colors.html" data-nav="colors">Colours</a>
      </nav>
      <div class="header-tools">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme"></button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Appearance settings"></button>
      </div>
    </div>
  </header>
  <div class="settings" id="settingsPanel" hidden></div>

  <main class="wrap">

    <section class="card" aria-labelledby="todayTitle">
      <div class="date-hero">
        <div class="date-big">
          <div class="d-day" id="bigDay">—</div>
          <div class="d-month" id="bigMonth">Month —</div>
        </div>
        <div>
          <h1 class="hero-title" id="todayTitle" style="font-size:clamp(1.5rem,4vw,2.1rem)">Today</h1>
          <p class="muted" style="margin:6px 0 14px" id="numericDate">—</p>
          <div class="hero-chips" id="dateChips"></div>
        </div>
      </div>
      <dl class="fact-grid" id="facts" style="margin:20px 0 0"></dl>
    </section>

    <section class="card" aria-labelledby="calTitle">
      <div class="section-head">
        <h2 id="calTitle">Calendar</h2>
        <div class="row" style="gap:6px;align-items:center">
          <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">‹</button>
          <button class="btn btn-sm btn-ghost" id="calToday" type="button">Today</button>
          <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="cal" id="calendar" aria-live="polite"></div>
      <p class="hint" style="margin:12px 0 0">Sunday first. Today is filled with your button colour.</p>
    </section>

    <details class="panel" open>
      <summary><span>All 12 months &amp; their last day <span class="hint" id="monthsYear">2026</span></span></summary>
      <div class="panel-body">
        <div class="row" style="margin-bottom:14px">
          <div class="field" style="max-width:170px">
            <label for="yearInput">Year to check</label>
            <input class="input" type="number" id="yearInput" min="1900" max="2200" step="1" inputmode="numeric">
          </div>
          <button class="btn btn-sm btn-primary" id="yearApply" type="button">Show</button>
          <button class="btn btn-sm btn-ghost" id="yearReset" type="button">This year</button>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Month</th>
                <th scope="col">Days</th>
                <th scope="col">Last day falls on</th>
              </tr>
            </thead>
            <tbody id="monthsBody"></tbody>
          </table>
        </div>
        <p class="hint" style="margin:12px 0 0" id="leapNote"></p>
      </div>
    </details>

  </main>

  <footer class="site-footer wrap">
    <p>Simple Tools · dates follow your device clock and time zone</p>
  </footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/date.js"></script>
</body>
</html>
